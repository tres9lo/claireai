<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClaireAI presence</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #05070d;
        --ink: #dbe7ff;
        --muted: #7f8ba8;
        --line: #1b2436;
        --idle: #4f8cff;
        --thinking: #9b7bff;
        --tool: #27c2a0;
        --approval: #ffb020;
        --speaking: #ff6fb1;
        --error: #ff5d5d;
        --offline: #6b7280;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 30%, #0d1424 0%, var(--bg) 70%);
        color: var(--ink);
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { width: min(520px, 92vw); text-align: center; }
      canvas { width: 280px; height: 280px; display: block; margin: 0 auto; }
      h1 { font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin: 8px 0 4px; }
      #state { font-size: 30px; font-weight: 600; letter-spacing: .01em; margin: 0; }
      #detail { min-height: 1.5em; color: var(--muted); margin: 4px 0 18px; font-variant-numeric: tabular-nums; }
      ul.indicators { list-style: none; padding: 0; margin: 0; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      ul.indicators li {
        display: flex; align-items: center; gap: 7px;
        border: 1px solid var(--line); border-radius: 999px;
        padding: 5px 12px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
        color: var(--muted);
      }
      ul.indicators .dot { width: 8px; height: 8px; border-radius: 50%; background: #2a3448; }
      ul.indicators li.on { color: var(--ink); border-color: #34405c; }
      ul.indicators li.on .dot { background: #ff4d6d; box-shadow: 0 0 10px #ff4d6d; }
      footer { margin-top: 22px; font-size: 12px; color: var(--muted); }
      footer a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
      code { color: #9fb3d9; }
      @media (prefers-reduced-motion: reduce) { canvas { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <h1>ClaireAI</h1>
      <canvas id="orb" width="560" height="560" role="img" aria-label="Assistant state indicator"></canvas>
      <p id="state">idle</p>
      <p id="detail">waiting</p>
      <ul class="indicators" id="indicators">
        <li data-key="microphone"><span class="dot"></span>mic</li>
        <li data-key="camera"><span class="dot"></span>camera</li>
        <li data-key="screen"><span class="dot"></span>screen</li>
        <li data-key="input"><span class="dot"></span>input</li>
      </ul>
      <footer>seq <span id="seq">0</span> · task <code id="task">—</code> · this view has no control over ClaireAI · <a href="/today">today's log</a></footer>
    </main>
    <script>
      const COLORS = {
        idle: "#4f8cff", thinking: "#9b7bff", tool_running: "#27c2a0",
        awaiting_approval: "#ffb020", speaking: "#ff6fb1", error: "#ff5d5d",
        offline: "#6b7280", listening: "#4fd1ff",
      };
      const canvas = document.getElementById("orb");
      const ctx = canvas.getContext("2d");
      const stateEl = document.getElementById("state");
      const detailEl = document.getElementById("detail");
      const seqEl = document.getElementById("seq");
      const taskEl = document.getElementById("task");
      const items = [...document.querySelectorAll("#indicators li")];
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      let current = { state: "idle", taskId: null, detail: {}, active: {}, seq: 0 };
      let lastFrame = 0;
      const FPS_CAP = 30;

      function draw(now) {
        requestAnimationFrame(draw);
        if (now - lastFrame < 1000 / FPS_CAP) return;
        lastFrame = now;

        const w = canvas.width, h = canvas.height;
        const cx = w / 2, cy = h / 2;
        const color = COLORS[current.state] || COLORS.idle;
        const t = reduceMotion.matches ? 0 : now / 1000;
        const pulse = current.state === "idle" ? 0.6 : 1;
        const radius = 120 + Math.sin(t * 1.6) * 14 * pulse;

        ctx.clearRect(0, 0, w, h);
        const glow = ctx.createRadialGradient(cx, cy, 8, cx, cy, radius * 1.9);
        glow.addColorStop(0, color);
        glow.addColorStop(0.35, color + "55");
        glow.addColorStop(1, "transparent");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 1.9, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.globalAlpha = 0.5;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.62, t, t + Math.PI * 1.3);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      requestAnimationFrame(draw);

      function render(event) {
        current = event;
        stateEl.textContent = event.state.replace(/_/g, " ");
        stateEl.style.color = COLORS[event.state] || "";
        const detail = event.detail || {};
        detailEl.textContent = detail.tool
          ? `${detail.tool}${detail.label ? " · " + detail.label : ""}`
          : detail.label || (event.state === "idle" ? "waiting" : "");
        seqEl.textContent = event.seq;
        taskEl.textContent = event.taskId ? event.taskId.slice(0, 8) : "—";
        for (const item of items) {
          item.classList.toggle("on", Boolean(event.active && event.active[item.dataset.key]));
        }
      }

      function connect() {
        const source = new EventSource("/events");
        source.addEventListener("presence", (message) => {
          try { render(JSON.parse(message.data)); } catch (_) { /* ignore malformed */ }
        });
        source.onerror = () => {
          source.close();
          // Fall back to polling, and keep the HUD honest about being offline.
          setTimeout(() => {
            fetch("/state").then((r) => r.json()).then(render).catch(() =>
              render({ state: "offline", seq: 0, taskId: null, detail: {}, active: {} })
            );
            connect();
          }, 1500);
        };
      }
      connect();
    </script>
  </body>
</html>
