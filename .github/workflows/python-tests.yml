name: python-tests

# Portable unit tests only. Ollama, audio devices, browser automation and desktop
# packaging are NOT available on hosted runners and are verified manually on real
# machines (see docs/platform-support.md).

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "assistant[dev]"
          # brain-lab's tokenizer and prompt renderer are pure Python, and the
          # assistant suite covers both. Installing the package without its
          # dependencies gives CI that coverage without pulling a torch wheel
          # onto four runners; the model tests stay on a real machine.
          python -m pip install -e "./brain-lab" --no-deps

      - name: Run unit tests
        working-directory: assistant
        run: python -m pytest
