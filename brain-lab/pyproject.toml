[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "claireai-scratch-brain"
version = "0.1.0"
description = "ClaireAI from-scratch research transformer"
requires-python = ">=3.11"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
vision = ["Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claire_brain = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["../assistant/tests", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM","TCH","ISC","G"]
