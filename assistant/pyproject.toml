[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "claireai"
version = "0.1.0"
description = "ClaireAI local-first personal assistant runtime (Track A)"
requires-python = ">=3.11"
dependencies = [
  # The assistant keeps external network access in explicit tools only.
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  # OS-specific application-data locations, maintained rather than hard-coded.
  "platformdirs>=4.2",
  # API layer, installed now, wired up only after the core services are tested.
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]
model = ["torch>=2.2"]
voice = ["faster-whisper>=1.1,<2"]
# The native window draws its own surfaces, so it needs a styling toolkit on top
# of Tk. Nothing else in the package does.
desktop = ["customtkinter>=5.2"]
# Local image understanding. torchvision is deliberately not listed: the wheel
# that resolves here does not register its operators against the installed torch,
# and CLIP needs only transformers, Pillow and NumPy.
vision = ["transformers>=4.40"]

[project.scripts]
# No arguments starts the local app; any argument is passed to the CLI
# unchanged, so `claireai --once "..."` and friends keep working.
claireai = "claireai.app:main"
claireai-desktop = "claireai.desktop.app:main"
claireai-ui = "claireai.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claireai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
