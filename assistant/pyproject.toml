[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "claireai"
version = "0.1.0"
description = "ClaireAI local-first personal assistant runtime (Track A)"
requires-python = ">=3.11"
dependencies = [
  # Upper bounds are deliberate: these are all pre-1.0 or fast-moving, and an
  # unbounded range means installing ClaireAI can silently upgrade a package the
  # owner already relies on (the classic "it worked before I installed this").
  # The assistant keeps external network access in explicit tools only.
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  # OS-specific application-data locations, maintained rather than hard-coded.
  "platformdirs>=4.2,<5",
  "apscheduler>=3.10,<4",
  # Email app passwords and connector keys belong in the OS keyring. The code
  # already imported this optionally; without it --email-setup could verify a
  # login and then have nowhere safe to put the password.
  "keyring>=24,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "pytest-asyncio>=0.23,<2",
  # Building test images for the vision layer. Pillow is small, is not on the
  # runtime path, and lets the blank-frame refusal tests run in CI instead of
  # being skipped there.
  "Pillow>=10,<13",
]
model = ["torch>=2.2,<3"]
# av 19 removed the `metadata_errors` keyword faster-whisper still passes to
# av.open, so an unbounded resolution installs cleanly and then fails on the
# first recording. Keep the decoder on a version its API supports.
voice = ["faster-whisper>=1.1,<2", "av>=11,<16"]
# `desktop` is the complete application, not just the widget toolkit: the
# window is useless without the local model runtime, and its Voice page is
# useless without faster-whisper. Installing the desktop app must not leave
# half of it behind. The granular `model` and `voice` extras stay available for
# a headless install that wants one of them only.
desktop = [
  "customtkinter>=5.2,<7",
  "torch>=2.2,<3",
  "faster-whisper>=1.1,<2",
  "av>=11,<16",
]
# Local image understanding: CLIP through transformers. torchvision is
# deliberately not listed, because the wheel that resolves here does not
# register its operators against the installed torch and CLIP does not need it.
# torch is repeated from the `model` extra on purpose: with transformers alone
# this extra installed, passed `pip check`, and then failed at the first image
# because nothing had pulled the runtime vision.py imports. Pillow decodes the
# image before the model sees it and was only ever a test dependency.
vision = ["transformers>=4.40,<6", "torch>=2.2,<3", "Pillow>=10,<13"]
# One resolution for everything, so the owner never installs extras one at a
# time and hits a conflict from a half-applied dependency set.
all = [
  "torch>=2.2,<3",
  "faster-whisper>=1.1,<2",
  "av>=11,<16",
  "customtkinter>=5.2,<7",
  "transformers>=4.40,<6",
  "Pillow>=10,<13",
]

[project.scripts]
# No arguments opens the native window; any argument is passed to the CLI
# unchanged, so `claireai --once "..."` and friends keep working.
claireai = "claireai.app:main"
# Through the launcher, not straight at the window: app.py imports the toolkit at
# module level, so a core install would fail before it could explain the extra.
claireai-desktop = "claireai.desktop.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claireai"]

[tool.pytest.ini_options]
# Always test the checkout, not a wheel that happens to be installed in the
# virtual environment. A stale site-packages copy otherwise hides source edits.
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
