[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "claireai"
version = "0.1.0"
description = "ClaireAI local-first personal assistant runtime (Track A)"
requires-python = ">=3.11"
dependencies = [
  # Upper bounds are deliberate: these are all pre-1.0 or fast-moving, and an
  # unbounded range means installing ClaireAI can silently upgrade a package the
  # owner already relies on (the classic "it worked before I installed this").
  # The assistant keeps external network access in explicit tools only.
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  # OS-specific application-data locations, maintained rather than hard-coded.
  "platformdirs>=4.2,<5",
  # API layer, installed now, wired up only after the core services are tested.
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "pytest-asyncio>=0.23,<2",
  # Building test images for the vision layer. Pillow is small, is not on the
  # runtime path, and lets the blank-frame refusal tests run in CI instead of
  # being skipped there.
  "Pillow>=10,<13",
]
model = ["torch>=2.2,<3"]
voice = ["faster-whisper>=1.1,<2"]
# The native window draws its own surfaces, so it needs a styling toolkit on top
# of Tk. Nothing else in the package does.
desktop = ["customtkinter>=5.2,<7"]
# Local image understanding: CLIP through transformers. torchvision is
# deliberately not listed, because the wheel that resolves here does not
# register its operators against the installed torch and CLIP does not need it.
# torch is repeated from the `model` extra on purpose: with transformers alone
# this extra installed, passed `pip check`, and then failed at the first image
# because nothing had pulled the runtime vision.py imports. Pillow decodes the
# image before the model sees it and was only ever a test dependency.
vision = ["transformers>=4.40,<6", "torch>=2.2,<3", "Pillow>=10,<13"]
# One resolution for everything, so the owner never installs extras one at a
# time and hits a conflict from a half-applied dependency set.
all = [
  "torch>=2.2,<3",
  "faster-whisper>=1.1,<2",
  "customtkinter>=5.2,<7",
  "transformers>=4.40,<6",
  "Pillow>=10,<13",
]

[project.scripts]
# No arguments starts the local app; any argument is passed to the CLI
# unchanged, so `claireai --once "..."` and friends keep working.
claireai = "claireai.app:main"
# Through the launcher, not straight at the window: app.py imports the toolkit at
# module level, so a core install would fail before it could explain the extra.
claireai-desktop = "claireai.desktop.launcher:main"
claireai-ui = "claireai.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claireai"]

# The app page is authored next to the desktop preview, outside the package
# directory, so a plain `pip install` would otherwise ship an app that starts
# and cannot find its own interface. Copy it to the location app.py looks in
# first (`claireai/web/index.html`).
[tool.hatch.build.targets.wheel.force-include]
"../desktop/presence/index.html" = "claireai/web/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
